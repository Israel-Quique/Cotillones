<aside class="inventory-sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-glow sidebar-glow-top"></div>
  <div class="sidebar-glow sidebar-glow-bottom"></div>

  <header class="sidebar-brand" [class.compact]="isCollapsed">
    <div class="sidebar-logo">{{ brand.logoLetter }}</div>
    <div class="sidebar-brand-copy" *ngIf="!isCollapsed">
      <strong>{{ brand.title }}</strong>
      <span>{{ brand.subtitle }}</span>
    </div>

    <button
      type="button"
      class="sidebar-toggle"
      [attr.aria-label]="isCollapsed ? 'Expandir menu lateral' : 'Minimizar menu lateral'"
      [attr.title]="isCollapsed ? 'Expandir menu lateral' : 'Minimizar menu lateral'"
      (click)="toggleSidebar()"
    >
      <i nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" nzTheme="outline"></i>
    </button>
  </header>

  <div class="sidebar-summary" *ngIf="!isCollapsed">
    <span class="summary-label">{{ summary.eyebrow }}</span>
    <strong>{{ summary.title }}</strong>
    <small>{{ summary.description }}</small>
  </div>

  <div class="sidebar-groups">
    <section class="sidebar-group" *ngFor="let group of navigationGroups">
      <div class="group-toggle" *ngIf="!isCollapsed">
        <span class="sidebar-group-heading">
          <span class="sidebar-group-title">{{ group.title }}</span>
        </span>
      </div>

      <div class="group-items" [class.open]="isCollapsed || isGroupExpanded(group.key)">
        <button
          *ngFor="let item of group.items"
          type="button"
          class="sidebar-link"
          [class.active]="isActive(item.route)"
          [class.accent-red]="item.accent === 'red'"
          [class.accent-amber]="item.accent === 'amber'"
          [class.accent-blue]="item.accent === 'blue'"
          [attr.title]="isCollapsed ? item.label : null"
          (click)="navigate(item.route)"
        >
          <span class="link-icon">
            <i nz-icon [nzType]="item.icon" nzTheme="outline"></i>
          </span>
          <span class="link-copy" *ngIf="!isCollapsed">
            <strong>{{ item.label }}</strong>
          </span>
          <span class="link-badge" *ngIf="!isCollapsed && item.badge">{{ item.badge }}</span>
          <span class="link-arrow" *ngIf="!isCollapsed && isActive(item.route)">
            <i nz-icon nzType="right" nzTheme="outline"></i>
          </span>
        </button>
      </div>
    </section>
  </div>

  <footer class="sidebar-user" *ngIf="!isCollapsed">
    <div class="user-avatar">{{ user.initials }}</div>
    <div class="user-copy">
      <strong>{{ user.name }}</strong>
      <span><i class="user-dot"></i> {{ user.status }}</span>
    </div>
    <button type="button" class="logout-button" (click)="logout()">
      <i nz-icon nzType="logout" nzTheme="outline"></i>
      Salir
    </button>
  </footer>
</aside>
