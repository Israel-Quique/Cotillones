<app-topbar></app-topbar>
<main class="flex h-screen">
  <app-sidebar></app-sidebar>
  <div class="bg-gray-100 p-4 flex-grow">
    <div class="container mx-auto bg-white p-6 rounded shadow">
      <nz-row>
        <nz-col [nzSpan]="24" *ngIf="showLista">
          <div class="content-wrapper">
            <header class="header-container">
              <div>
                <h1 class="text-2xl font-semibold">Lista de Ubicaciones - Cotillones Riky</h1>
              </div>
              <div class="header-buttons">
                <button nz-button nzType="default" class="export-button" (click)="exportarAExcel()">
                  <i nz-icon nzType="file-excel" nzTheme="outline"></i> Exportar Excel
                </button>
                <button nz-button nzType="primary" class="register-button" (click)="openRegistro()">
                  <i nz-icon nzType="plus" nzTheme="outline" ></i> Nueva Ubicación
                </button>
              </div>
            </header>
            <div class="search-container mb-4">
              <nz-input-group [nzSuffix]="suffixTemplate">
                <input type="text" nz-input class="search-input" placeholder="Buscar" [(ngModel)]="searchTerm" />
              </nz-input-group>
              <ng-template #suffixTemplate>
                <i nz-icon nzType="search"></i>
              </ng-template>
            </div>
            <div class="table-container">
              <nz-table #basicTable [nzData]="ubicaciones" class="data-table">
                <thead>
                  <tr>
                    <th>Código QR</th>
                    <th>Zona ABC</th>
                    <th>Descripción</th>
                    <th>Nivel</th>
                    <th>Capacidad</th>
                    <th>Fecha Registro</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let ubicacion of basicTable.data">
                    <td><img src="{{ ubicacion.codigo_qr }}" alt="Código QR de la ubicación" /></td>
                    <td>{{ ubicacion.zona_abc }}</td>
                    <td>{{ ubicacion.descripcion }}</td>
                    <td>{{ ubicacion.nivel }}</td>
                    <td>{{ ubicacion.capacidad }}</td>
                    <td>{{ ubicacion.fecha_registro }}</td>
                    <td class="text-center action-buttons">
                      <button nz-button nzType="primary" nzSize="small" class="edit-button" (click)="openRegistro(ubicacion)">
                        <i nz-icon nzType="edit" nzTheme="outline"></i>
                      </button>
                      <button nz-button nzType="default" nzSize="small" class="qr-export-button" (click)="exportarQR(ubicacion.codigo_qr, ubicacion.id_ubicacion)">
                        <i nz-icon nzType="qrcode" nzTheme="outline"></i> Exportar QR
                      </button>
                    </td>
                  </tr>
                </tbody>
              </nz-table>
            </div>
          </div>
        </nz-col>
        <nz-col [nzSpan]="24" *ngIf="showRegistro">
          <app-registro (formSubmit)="onSubmitRegistro($event)" (closeForm)="closeRegistro()" ></app-registro>
          <button nz-button nzType="default" class="mt-4" (click)="closeRegistro()">
            <i nz-icon nzType="arrow-left" nzTheme="outline"></i> Volver a la lista
          </button>
        </nz-col>
      </nz-row>
    </div>
  </div>
</main>
