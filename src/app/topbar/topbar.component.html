<canvas
  #confettiCanvas
  class="topbar-confetti-canvas"
  [class.is-active]="isPartyMode"
></canvas>

<div
  class="topbar-toast"
  *ngIf="toast.visible"
  [class.toast-success]="toast.type === 'success'"
  [class.toast-info]="toast.type === 'info'"
>
  <strong>{{ toast.title }}</strong>
  <span>{{ toast.message }}</span>
</div>

<header class="inventory-topbar">
  <div class="topbar-brand">
    <div class="brand-mark">
      <span class="brand-symbol">R</span>
    </div>
    <div class="brand-copy">
      <p class="eyebrow">{{ eyebrow }}</p>
      <div class="brand-title-row">
        <span class="brand-chip">Cotillones Ricky</span>
      </div>
      <h1 class="brand-title">{{ description }}</h1>
    </div>
  </div>

  <div class="topbar-actions">
    <button type="button" class="party-toggle" [class.active]="isPartyMode" (click)="togglePartyMode()">
      <span class="party-icon"></span>
      <span>Fiesta</span>
    </button>
    <button type="button" class="theme-toggle" [class.active]="isDarkMode" (click)="toggleDarkMode()">
      <span class="theme-glyph" [class.dark]="isDarkMode"></span>
    </button>
  </div>

  <div class="topbar-status">
    <div
      class="status-card"
      *ngFor="let card of statusCards"
      [class.status-card-highlight]="card.highlight"
    >
      <span class="status-label">{{ card.label }}</span>
      <strong>{{ card.value }}</strong>
      <small>{{ card.detail }}</small>
    </div>
  </div>
</header>
