<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RICKY</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="./assets/ricky.png">
  <script>
    (function () {
      try {
        var darkMode = localStorage.getItem('ricky_dark_mode') === 'true' || localStorage.getItem('theme') === 'dark';
        document.documentElement.classList.toggle('dark', darkMode);
        document.documentElement.classList.toggle('dark-mode', darkMode);
      } catch (error) {
        document.documentElement.classList.remove('dark', 'dark-mode');
      }
    })();
  </script>
</head>
<body>
  <script>
    (function () {
      try {
        document.body.classList.toggle('dark-mode', document.documentElement.classList.contains('dark-mode'));
      } catch (error) {
        document.body.classList.remove('dark-mode');
      }
    })();
  </script>
  <app-root></app-root>
</body>
</html>
